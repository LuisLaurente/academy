name: learning-os

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    command: ['pnpm', 'turbo', 'run', 'dev', '--filter=@learning-os/web', '--env-mode=loose']
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      API_PORT: 3001
      BULLMQ_PREFIX: learning-os
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://learning_os:learning_os_dev@postgres:5432/learning_os?schema=public
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    command: ['pnpm', 'turbo', 'run', 'dev', '--filter=@learning-os/api', '--env-mode=loose']
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3001/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - edge
      - data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learning_os
      POSTGRES_PASSWORD: learning_os_dev
      POSTGRES_USER: learning_os
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learning_os -d learning_os']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
