version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: learning_os_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: learning_os
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: learning_os_redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: learning_os_api
    restart: always
    ports:
      - '3002:3001'
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/learning_os?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: https://academy.k321.lat
      AUTH_COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: learning_os_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://academy.k321.lat
      INTERNAL_API_URL: http://api:3001
    depends_on:
      - api

volumes:
  postgres_data:
